name: Build Forest Rush C++ APK

on:
  workflow_dispatch:
  push:
    branches: [ forest-rush-cpp ]
    paths:
      - 'ForestRushCpp/**'
      - '.github/workflows/build-cpp-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;35.0.0" \
            "ndk;23.2.8568313"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Fetch raylib 6.0
        run: git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git raylib

      - name: Build raylib for Android arm64
        shell: bash
        run: |
          make -C raylib/src clean || true
          make -C raylib/src \
            PLATFORM=PLATFORM_ANDROID \
            ANDROID_ARCH=arm64 \
            ANDROID_API_VERSION=29 \
            ANDROID_NDK="$ANDROID_NDK_ROOT" \
            RAYLIB_LIBTYPE=STATIC
          test -f raylib/src/libraylib.a

      - name: Prepare C++ Android makefile
        shell: bash
        run: |
          cp raylib/examples/Makefile.Android ForestRushCpp/Makefile.Android
          cd ForestRushCpp
          python3 - <<'PY'
          p='Makefile.Android'
          s=open(p,encoding='utf-8').read()
          s=s.replace('OBJS = $(patsubst %.c, $(PROJECT_BUILD_PATH)/obj/%.o, $(PROJECT_SOURCE_FILES))',
                      'OBJS = $(patsubst %.cpp, $(PROJECT_BUILD_PATH)/obj/%.o, $(PROJECT_SOURCE_FILES))')
          s=s.replace('$(PROJECT_BUILD_PATH)/obj/%.o:%.c','$(PROJECT_BUILD_PATH)/obj/%.o:%.cpp')
          s=s.replace('$(CC) -o $(PROJECT_BUILD_PATH)/lib/$(ANDROID_ARCH_NAME)/lib$(PROJECT_LIBRARY_NAME).so',
                      '$(CXX) -o $(PROJECT_BUILD_PATH)/lib/$(ANDROID_ARCH_NAME)/lib$(PROJECT_LIBRARY_NAME).so')
          s=s.replace('$(CC) -c $^ -o $@ $(INCLUDE_PATHS) $(CFLAGS)',
                      '$(CXX) -c $^ -o $@ $(INCLUDE_PATHS) $(CFLAGS)')
          s=s.replace('-std=c99','-std=c++17')
          open(p,'w',encoding='utf-8').write(s)
          PY
          grep -n "%.cpp\|CXX\|std=c++17" Makefile.Android | tail -20

      - name: Build APK
        shell: bash
        working-directory: ForestRushCpp
        run: |
          CXX="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
          make -f Makefile.Android \
            RAYLIB_PATH="$GITHUB_WORKSPACE/raylib" \
            RAYLIB_LIBTYPE=STATIC \
            PROJECT_NAME=ForestRushCpp \
            PROJECT_SOURCE_FILES=main.cpp \
            PROJECT_RESOURCES_PATH=resources \
            ANDROID_HOME="$ANDROID_HOME" \
            ANDROID_NDK="$ANDROID_NDK_ROOT" \
            ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" \
            ANDROID_API_VERSION=29 \
            ANDROID_ARCH=ARM64 \
            APP_LABEL_NAME=ForestRush \
            APP_COMPANY_NAME=olegrub \
            APP_PRODUCT_NAME=forestrushcpp \
            APP_SCREEN_ORIENTATION=portrait \
            APP_KEYSTORE_PASS=forestrush \
            CXX="$CXX"
          test -f ForestRushCpp.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ForestRushCpp.apk
          cp ForestRushCpp.apk "$GITHUB_WORKSPACE/ForestRushCpp.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForestRushCpp-Android-APK
          path: ForestRushCpp.apk
          if-no-files-found: error

      - name: Publish APK on build branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ForestRushCpp.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Forest Rush C++ APK [skip ci]"
          git push origin HEAD:forest-rush-cpp
