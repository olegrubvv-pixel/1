<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AI Фото → 3D</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#090d18;color:#f7f9ff}body{overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}header{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}.tag{font-size:11px;padding:5px 9px;border-radius:20px;background:#202a49;border:1px solid #35436d}.viewer{position:relative;flex:1;min-height:260px;margin:0 12px;border-radius:24px;overflow:hidden;border:1px solid #253253;background:radial-gradient(circle at 50% 32%,#23315a,#0b101c 58%)}model-viewer{width:100%;height:100%}.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.icon{width:82px;height:82px;border-radius:28px;background:linear-gradient(145deg,#7c8cff,#4fd8ff);display:grid;place-items:center;font-size:36px}.empty h3{margin:15px 0 6px}.empty p{font-size:13px;color:#98a6c7;margin:0;max-width:280px}.photo{position:absolute;right:10px;top:10px;width:72px;height:72px;border-radius:15px;object-fit:contain;background:#111827;border:1px solid #42517d;display:none}.views{position:absolute;left:9px;right:9px;bottom:9px;display:none;grid-template-columns:repeat(4,1fr);gap:6px}.views img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:#101725;border:1px solid #354266}.panel{max-height:50vh;overflow:auto;padding:12px 14px 18px;background:#11182a;border-radius:24px 24px 0 0;border-top:1px solid #253251}#file{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:16px;padding:14px 10px;font-weight:800;color:white;background:linear-gradient(135deg,#7c8cff,#6073f4)}.btn.green{background:linear-gradient(135deg,#3bca83,#35bfa6)}.btn.dark{background:#202a49;border:1px solid #35436c}.btn:disabled{opacity:.4}.pick{display:flex;align-items:center;justify-content:center}.box{margin-top:11px;padding:12px;border-radius:18px;background:#0e1525;border:1px solid #283452}.title{font-weight:800;font-size:13px;display:flex;justify-content:space-between}.title small{font-weight:500;color:#8997b8}input,select{width:100%;margin-top:9px;padding:12px;border-radius:13px;border:1px solid #354267;background:#19223b;color:white;outline:none}.check{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:10px;color:#dce3f8}.progress{height:8px;margin-top:10px;background:#202944;border-radius:20px;overflow:hidden;display:none}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c8cff,#4fd8ff);transition:.35s}.status{min-height:20px;font-size:12px;color:#9aa8c8;margin-top:9px;line-height:1.4}.note{font-size:11px;color:#7786aa;margin-top:7px;line-height:1.35}
</style></head><body><div class="app"><header><b>AI Фото → 3D</b><span class="tag">GLB mesh</span></header><div class="viewer"><model-viewer id="mv" camera-controls auto-rotate shadow-intensity="1" exposure="1.05" environment-image="neutral" interaction-prompt="none"></model-viewer><img id="photo" class="photo"><div id="empty" class="empty"><div class="icon">✦</div><h3>Настоящая 3D-модель</h3><p>Загрузи фото. AI достроит объект с невидимых сторон и создаст полноценную геометрию.</p></div><div id="views" class="views"></div></div><div class="panel"><input id="file" type="file" accept="image/jpeg,image/png"><div class="grid"><label for="file" class="btn pick">Выбрать фото</label><button id="go" class="btn green" disabled>Создать 3D</button></div><div class="box"><div class="title">Meshy API <small>не сохраняется</small></div><input id="key" type="password" placeholder="Вставь Meshy API key"><div class="note">Ключ нужен для настоящей AI-генерации. Он используется только для запросов к Meshy.</div></div><div class="box"><div class="title">Качество <small>геометрия + текстуры</small></div><select id="quality"><option value="standard">Высокое</option><option value="smart">Smart Topology</option><option value="ultra">Ultra</option></select><label class="check"><span>PBR материалы</span><input id="pbr" type="checkbox" checked style="width:auto;margin:0;transform:scale(1.25)"></label></div><div class="grid" style="margin-top:11px"><button id="clear" class="btn dark" disabled>Новая модель</button><button id="save" class="btn green" disabled>Скачать GLB</button></div><div id="prog" class="progress"><i id="bar"></i></div><div id="status" class="status">Выбери JPG или PNG.</div></div></div>
<script>
const $=x=>document.getElementById(x);let imageData='',task='',glb='',timer=null;
function st(t,p){$('status').textContent=t;if(p!==undefined){$('prog').style.display='block';$('bar').style.width=Math.max(2,Math.min(100,p))+'%'}}
$('file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!/image\/(jpeg|png)/.test(f.type)){st('Нужен JPG или PNG.');return}const r=new FileReader();r.onload=()=>{imageData=r.result;$('photo').src=imageData;$('photo').style.display='block';$('empty').style.display='none';$('go').disabled=false;$('clear').disabled=false;$('save').disabled=true;$('mv').removeAttribute('src');$('views').style.display='none';st('Фото загружено. Нажми «Создать 3D».')};r.readAsDataURL(f)};
$('go').onclick=()=>{if(!imageData)return;const k=$('key').value.trim();if(!k){st('Сначала вставь Meshy API key.');return}$('go').disabled=true;st('Отправляю фото в AI…',4);Android.create(imageData,k,$('quality').value,$('pbr').checked)};
window.onCreated=id=>{task=id;st('AI строит объём и невидимые стороны…',8);setTimeout(check,3500)};
function check(){if(!task)return;Android.status(task,$('key').value.trim())}
window.onStatus=text=>{let d;try{d=JSON.parse(text)}catch(e){onError('Некорректный ответ AI');return}let p=Number(d.progress)||0;if(d.status==='SUCCEEDED'){glb=d.model_urls&&d.model_urls.glb||'';st('Готово. Создан настоящий GLB mesh.',100);$('go').disabled=false;if(glb){$('mv').src=glb;$('save').disabled=false}showViews(d.thumbnail_urls);return}if(d.status==='FAILED'||d.status==='CANCELED'){onError(d.task_error&&d.task_error.message||'Генерация не удалась');return}st(d.status==='PENDING'?'Задача в очереди AI…':'Создаю геометрию и текстуры…',Math.max(8,p));timer=setTimeout(check,4500)};
window.onError=m=>{$('go').disabled=false;st('Ошибка: '+m)};
function showViews(v){if(!v)return;const a=[v.front,v.right,v.back,v.left].filter(Boolean);if(!a.length)return;$('views').innerHTML=a.map(x=>'<img src="'+x+'">').join('');$('views').style.display='grid'}
$('save').onclick=()=>{if(glb)Android.download(glb)};$('clear').onclick=()=>{if(timer)clearTimeout(timer);imageData='';task='';glb='';$('file').value='';$('photo').style.display='none';$('empty').style.display='flex';$('mv').removeAttribute('src');$('views').style.display='none';$('go').disabled=true;$('save').disabled=true;$('clear').disabled=true;$('prog').style.display='none';st('Выбери JPG или PNG.')};
</script></body></html>
